name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate schemas and fixtures
        run: python scripts/validate_schemas.py
      - name: Conformance suite
        run: go run ./cmd/srac-attest verify-suite --fixtures fixtures --policy policy/example-policy.json
